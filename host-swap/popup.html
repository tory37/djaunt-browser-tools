<meta charset="utf-8">
<title>Host Swap</title>
<link rel="stylesheet" href="popup.css">
<div class="shell">
  <header class="bar">
    <h1>HOST&nbsp;SWAP</h1>
    <span class="pill" id="pill" data-state="idle">OFF</span>
  </header>

  <div class="list" id="list"></div>

  <p class="empty" id="empty" hidden>No swaps yet.</p>

  <div class="actions">
    <button type="button" class="add" id="add">+ Add swap</button>
  </div>

  <footer class="status" id="status" role="status"></footer>
</div>

<template id="rowTemplate">
  <section class="swap" data-open="false">
    <div class="swap-head">
      <button type="button" class="disclose" aria-expanded="false">
        <svg class="caret" width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true">
          <path d="M3 1.5 7 5 3 8.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="square"/>
        </svg>
        <span class="swap-summary">
          <span class="swap-from"></span>
          <span class="swap-to"></span>
        </span>
      </button>
      <button type="button" class="switch" role="switch" aria-checked="false"
              aria-label="Enable this swap">
        <span class="knob"></span>
      </button>
      <button type="button" class="remove" aria-label="Delete this swap">&times;</button>
    </div>

    <div class="swap-body">
      <div class="field">
        <label>From host</label>
        <input type="text" class="source-host" spellcheck="false" autocomplete="off"
               placeholder="old-host.example.com">
        <p class="hint">Scheme and path are ignored. Omit the port to match any port.</p>
      </div>

      <div class="field">
        <label>To host</label>
        <input type="text" class="target" spellcheck="false" autocomplete="off"
               placeholder="new-host.example.com">
        <p class="hint">A path here is prepended, e.g. <code>new-host.example.com/my-branch</code>.</p>
      </div>

      <div class="field">
        <span class="label-text">Apply to</span>
        <div class="segmented" role="radiogroup" aria-label="Request scope">
          <button type="button" class="seg" role="radio" aria-checked="true"
                  data-scope="navigation">Navigation</button>
          <button type="button" class="seg" role="radio" aria-checked="false"
                  data-scope="all">All requests</button>
        </div>
        <p class="hint scope-hint">Page and iframe loads only. Leaves API calls alone.</p>
      </div>

      <div class="preview" aria-live="polite">
        <span class="preview-label">Preview</span>
        <code class="preview-from"></code>
        <div class="preview-arrow" aria-hidden="true">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M6 1v9M2.5 6.5 6 10l3.5-3.5" stroke="currentColor" stroke-width="1.4"
                  stroke-linecap="square"/>
          </svg>
        </div>
        <code class="preview-to"></code>
      </div>

      <p class="row-error" hidden></p>
    </div>
  </section>
</template>

<script type="module" src="popup.js"></script>
