<!doctype html>
<html lang="en" data-dj-theme="void">
<head>
  <meta charset="UTF-8">
  <title>Dark Mode</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel">
    <header class="dj-head" id="head" data-state="idle">
      <span class="dj-mark" aria-hidden="true"></span>
      <span class="dj-titles">
        <span class="dj-wordmark" role="img" aria-label="Djaunt"></span>
        <h1 class="dj-title">Dark mode</h1>
      </span>
      <span class="dj-pill" id="pill" data-state="idle">off</span>
    </header>

    <p class="host" id="host">—</p>
    <p class="detected dj-hint" id="detected"></p>

    <div class="field">
      <div class="row">
        <button type="button" class="dj-switch" id="global" role="switch" aria-checked="false"
                aria-label="Enable dark mode everywhere">
          <span class="dj-knob"></span>
        </button>
        <span class="row-copy">
          <span class="row-title">Enable everywhere</span>
          <span class="dj-hint">Applies to every site, skipping ones that already look dark</span>
        </span>
      </div>
    </div>

    <section class="field" id="override-block">
      <span class="dj-label">For <span id="override-host">this site</span></span>
      <div class="dj-seg-group" id="segmented" role="radiogroup" aria-label="Per-site override">
        <button type="button" class="dj-seg" role="radio" aria-checked="true" data-value="auto">Auto</button>
        <button type="button" class="dj-seg" role="radio" aria-checked="false" data-value="on">Always on</button>
        <button type="button" class="dj-seg" role="radio" aria-checked="false" data-value="off">Always off</button>
      </div>
      <p class="dj-hint">Remembered until the browser restarts</p>
    </section>

    <footer class="dj-foot" id="applied" role="status"></footer>

    <p class="unsupported dj-hint" id="unsupported" hidden>
      Dark mode is not available on this page.
    </p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
