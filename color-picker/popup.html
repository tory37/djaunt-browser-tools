<!doctype html>
<html lang="en" data-dj-theme="deep">
<meta charset="utf-8">
<title>Color Picker</title>
<link rel="stylesheet" href="popup.css">
<body>
<div class="shell">
  <header class="dj-head" id="head">
    <span class="dj-mark" aria-hidden="true"></span>
    <span class="dj-titles">
      <span class="dj-wordmark" role="img" aria-label="Djaunt"></span>
      <h1 class="dj-title">Color picker</h1>
    </span>
  </header>

  <div class="dj-seg-group tabs" role="tablist" aria-label="Panel">
    <button type="button" class="dj-seg" role="tab" aria-selected="true" data-tab="pick">Pick</button>
    <button type="button" class="dj-seg" role="tab" aria-selected="false" data-tab="history">History</button>
    <button type="button" class="dj-seg" role="tab" aria-selected="false" data-tab="gradient">Gradient</button>
    <button type="button" class="dj-seg" role="tab" aria-selected="false" data-tab="contrast">Contrast</button>
  </div>

  <section class="panel" id="panel-pick" role="tabpanel">
    <button type="button" class="dj-btn pick-btn" id="pick">
      <svg class="dj-icon" width="14" height="14" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true">
        <path d="m2 22 1-4 9.6-9.6a2 2 0 0 1 2.8 0l1.2 1.2a2 2 0 0 1 0 2.8L7 22z"/>
        <path d="m14.5 5.5 4 4"/>
        <path d="m17 2 5 5-2.5 2.5-5-5z"/>
      </svg>
      Pick color from page
    </button>
    <p class="dj-hint" id="pick-hint"></p>

    <div class="swatch-preview" id="swatch" data-empty="true">
      <span class="swatch-empty">No color picked yet</span>
    </div>

    <div class="fmt-list" id="fmt-list" hidden>
      <div class="fmt-row" data-format="hex">
        <span class="dj-label">Hex</span>
        <code class="fmt-value"></code>
        <button type="button" class="copy-btn" aria-label="Copy hex">Copy</button>
      </div>
      <div class="fmt-row" data-format="rgb">
        <span class="dj-label">RGB</span>
        <code class="fmt-value"></code>
        <button type="button" class="copy-btn" aria-label="Copy RGB">Copy</button>
      </div>
      <div class="fmt-row" data-format="hsl">
        <span class="dj-label">HSL</span>
        <code class="fmt-value"></code>
        <button type="button" class="copy-btn" aria-label="Copy HSL">Copy</button>
      </div>
      <div class="fmt-row" data-format="oklch">
        <span class="dj-label">OKLCH</span>
        <code class="fmt-value"></code>
        <button type="button" class="copy-btn" aria-label="Copy OKLCH">Copy</button>
      </div>
    </div>
  </section>

  <section class="panel" id="panel-history" role="tabpanel" hidden>
    <div class="swatch-grid" id="history-grid"></div>
    <p class="empty dj-hint" id="history-empty" hidden>No colors picked yet.</p>
    <div class="actions">
      <button type="button" class="dj-btn" id="clear-history">Clear history</button>
    </div>
  </section>

  <section class="panel" id="panel-gradient" role="tabpanel" hidden>
    <div class="field">
      <span class="dj-label">Type</span>
      <div class="dj-seg-group" role="radiogroup" aria-label="Gradient type">
        <button type="button" class="dj-seg" role="radio" aria-checked="true" data-type="linear">Linear</button>
        <button type="button" class="dj-seg" role="radio" aria-checked="false" data-type="radial">Radial</button>
      </div>
    </div>

    <div class="field" id="angle-field">
      <span class="dj-label">Angle <span id="angle-value">90°</span></span>
      <input type="range" id="angle" min="0" max="360" value="90">
    </div>

    <div class="stop-list" id="stop-list"></div>

    <div class="actions">
      <button type="button" class="dj-btn" id="add-stop">
        <svg class="dj-icon" width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14"/><path d="M12 5v14"/>
        </svg>
        Add stop
      </button>
    </div>

    <div class="gradient-preview" id="gradient-preview"></div>

    <div class="fmt-row output-row">
      <code class="fmt-value" id="gradient-output"></code>
      <button type="button" class="copy-btn" id="copy-gradient">Copy</button>
    </div>
  </section>

  <section class="panel" id="panel-contrast" role="tabpanel" hidden>
    <div class="field">
      <span class="dj-label">Foreground</span>
      <div class="color-input-row">
        <input type="color" id="fg-swatch" value="#f2f2f2">
        <input type="text" class="hex-input" id="fg-hex" spellcheck="false" autocomplete="off">
      </div>
    </div>

    <div class="field">
      <span class="dj-label">Background</span>
      <div class="color-input-row">
        <input type="color" id="bg-swatch" value="#0a0a0a">
        <input type="text" class="hex-input" id="bg-hex" spellcheck="false" autocomplete="off">
      </div>
    </div>

    <div class="contrast-preview" id="contrast-preview">
      <span class="contrast-sample-large">Large text sample</span>
      <span class="contrast-sample-normal">Normal text sample</span>
    </div>

    <div class="contrast-ratio" id="contrast-ratio">21.00:1</div>

    <div class="contrast-badges">
      <span class="dj-pill" id="badge-aa-normal">AA normal</span>
      <span class="dj-pill" id="badge-aaa-normal">AAA normal</span>
      <span class="dj-pill" id="badge-aa-large">AA large</span>
      <span class="dj-pill" id="badge-aaa-large">AAA large</span>
    </div>
  </section>

  <footer class="dj-foot" id="status" role="status"></footer>
</div>

<template id="swatchTemplate">
  <div class="swatch-cell">
    <button type="button" class="swatch-select" aria-label="Use this color"></button>
    <button type="button" class="swatch-remove" aria-label="Remove from history">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
      </svg>
    </button>
  </div>
</template>

<template id="stopTemplate">
  <div class="stop-row">
    <input type="color" class="stop-swatch">
    <input type="text" class="hex-input stop-hex" spellcheck="false" autocomplete="off">
    <input type="range" class="stop-pos" min="0" max="100">
    <span class="stop-pos-value dj-label"></span>
    <button type="button" class="stop-remove" aria-label="Remove stop">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
      </svg>
    </button>
  </div>
</template>

<script type="module" src="popup.js"></script>
</body>
</html>
